<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imbiss-Rechenhilfe</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f4f6f3;color:#183529;margin:0;padding:14px}.wrap{max-width:650px;margin:auto}header{background:#183529;color:white;padding:20px;border-radius:16px}h1{margin:0;font-size:25px}header p{margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.tile{border:2px solid #d6ded7;background:white;border-radius:14px;min-height:115px;padding:13px;text-align:left;font-size:19px;font-weight:700;touch-action:manipulation}.tile.active{background:#e4f5e9;border-color:#29835a}.tile small{display:block;font-size:17px;margin-top:10px}.panel{background:white;border-radius:14px;padding:16px;margin-top:14px}.line{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.big{font-size:26px;font-weight:800}.field{width:100%;font-size:24px;padding:12px;border:2px solid #acb9ae;border-radius:10px;margin-top:8px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.quick button,.reset{padding:14px;border:0;border-radius:10px;font-size:17px}.quick button{background:#e9eeeb}.reset{background:#183529;color:white;font-weight:bold;width:100%;margin-top:14px}.change{font-size:33px;font-weight:bold;color:#147748}.note{font-size:12px;color:#53645b;line-height:1.5}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="wrap"><header><h1>Imbiss-Rechenhilfe</h1><p>Artikel antippen · Summe und Rückgeld automatisch</p></header><div class="grid" id="grid"></div><section class="panel"><div id="lines"></div><div class="line big"><span>Gesamt</span><span id="total">0,00 €</span></div></section><section class="panel"><label for="paid"><b>Kunde gibt (€)</b></label><input id="paid" class="field" inputmode="decimal" placeholder="z. B. 40,00"><div class="quick"><button data-v="10">10 €</button><button data-v="20">20 €</button><button data-v="50">50 €</button><button data-v="100">100 €</button></div><p>Rückgeld</p><div class="change" id="change">–</div><div id="warn" style="color:#b42318"></div></section><button class="reset" id="reset">Neue Bestellung</button><p class="note">Nur Rechenhilfe, keine steuerliche Registrierkasse. Einnahmen bitte separat ordnungsgemäß erfassen. Preise werden vom Betreiber festgelegt; Mitarbeiter können sie hier nicht ändern.</p></div><script>const items=[['Bier',650],['Alster',650],['Cola',600],['Sprite',600],['Kaffee',250],['Bratwurst',400],['Pommes',400],['currywurst',500],['Wasser',450]];const q=items.map(()=>0),fmt=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const grid=document.getElementById('grid'),paid=document.getElementById('paid');function render(){grid.replaceChildren();items.forEach(([name,c],i)=>{const b=document.createElement('button');b.className='tile'+(q[i]?' active':'');b.textContent=name;const s=document.createElement('small');s.textContent=fmt(c)+(q[i]?' · '+q[i]+' ×':'');b.append(s);b.onclick=()=>{q[i]++;render()};b.oncontextmenu=e=>{e.preventDefault();q[i]=Math.max(0,q[i]-1);render()};grid.append(b)});const lines=document.getElementById('lines');lines.replaceChildren();items.forEach(([name,c],i)=>{if(q[i]){const d=document.createElement('div');d.className='line';const a=document.createElement('span'),b=document.createElement('span');a.textContent=q[i]+' × '+name;b.textContent=fmt(q[i]*c);d.append(a,b);lines.append(d)}});const total=items.reduce((s,x,i)=>s+x[1]*q[i],0);document.getElementById('total').textContent=fmt(total);const v=paid.value.trim().replace(',','.');const valid=/^\d+(\.\d{0,2})?$/.test(v);const ch=document.getElementById('change'),w=document.getElementById('warn');if(!v){ch.textContent='–';w.textContent=''}else if(!valid){ch.textContent='–';w.textContent='Bitte gültigen Betrag eingeben'}else{const cents=Math.round(Number(v)*100);ch.textContent=cents>=total?fmt(cents-total):'–';w.textContent=cents<total?'Es fehlen '+fmt(total-cents):''}}paid.addEventListener('input',render);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{paid.value=b.dataset.v;render()});document.getElementById('reset').onclick=()=>{q.fill(0);paid.value='';render();window.scrollTo(0,0)};render();</script></body></html>
